<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lamps Dev Tool · 骰运迷城</title>
    <script src="https://l1.hoorahgo.com/lamps/creator/qa/lamps-dev-tool.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07060a;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="game" allow="autoplay; fullscreen; gamepad"></iframe>
    <script>
      // 本地调试用:把本页查询参数转发给游戏(例如 ?scene=a1_goblin_ambush 直达某个场景)
      var q = location.search ? location.search.slice(1) : ""
      document.getElementById("game").src = "./index.html" + (q ? "?" + q : "")
    </script>
  </body>
